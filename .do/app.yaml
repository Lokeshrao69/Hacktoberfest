# DigitalOcean App Platform spec.
#   doctl apps create --spec .do/app.yaml
# Replace the github repo below with yours, then set MODEL_ACCESS_KEY in the
# App Platform console (Settings -> Environment Variables, encrypted).
name: clauseguard
region: nyc
services:
  - name: web
    dockerfile_path: Dockerfile
    github:
      repo: YOUR_GITHUB_USER/clauseguard
      branch: main
      deploy_on_push: true
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    health_check:
      http_path: /api/health
    envs:
      - key: LLM_BASE_URL
        value: https://inference.do-ai.run/v1
      - key: LLM_MODEL
        value: openai-gpt-oss-120b
      - key: MODEL_ACCESS_KEY
        type: SECRET
        scope: RUN_TIME
